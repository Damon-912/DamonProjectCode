<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Base64编码测试</title>
</head>
<body>
    <h1>Base64编码测试</h1>
    
    <div>
        <h3>测试CSV内容：</h3>
        <textarea id="csvContent" rows="5" cols="80">ICD代码,ICD描述,版本,生效日期,失效日期,备注
A01.001,伤寒,ICD-10,2024-01-01,2099-12-31,国家标准版
A01.002,副伤寒,ICD-10,2024-01-01,,</textarea>
    </div>
    
    <div>
        <button onclick="testEncoding()">测试编码</button>
    </div>
    
    <div>
        <h3>编码结果：</h3>
        <div id="result"></div>
    </div>
    
    <script>
        function testEncoding() {
            const csvContent = document.getElementById('csvContent').value;
            const resultDiv = document.getElementById('result');
            
            // 方法1: 使用btoa（可能导致中文字符问题）
            try {
                const base64Method1 = btoa(csvContent);
                resultDiv.innerHTML += `<h4>方法1 (btoa直接编码):</h4>`;
                resultDiv.innerHTML += `<p>${base64Method1}</p>`;
            } catch (e) {
                resultDiv.innerHTML += `<h4>方法1失败: ${e.message}</h4>`;
            }
            
            // 方法2: 使用encodeURIComponent + btoa
            try {
                const encodedURI = encodeURIComponent(csvContent);
                const base64Method2 = btoa(encodedURI);
                resultDiv.innerHTML += `<h4>方法2 (encodeURIComponent + btoa):</h4>`;
                resultDiv.innerHTML += `<p>${base64Method2}</p>`;
            } catch (e) {
                resultDiv.innerHTML += `<h4>方法2失败: ${e.message}</h4>`;
            }
            
            // 方法3: 使用TextEncoder
            try {
                const encoder = new TextEncoder();
                const utf8Bytes = encoder.encode(csvContent);
                let binaryString = '';
                for (let i = 0; i < utf8Bytes.length; i++) {
                    binaryString += String.fromCharCode(utf8Bytes[i]);
                }
                const base64Method3 = btoa(binaryString);
                resultDiv.innerHTML += `<h4>方法3 (TextEncoder):</h4>`;
                resultDiv.innerHTML += `<p>${base64Method3}</p>`;
            } catch (e) {
                resultDiv.innerHTML += `<h4>方法3失败: ${e.message}</h4>`;
            }
            
            // 方法4: 使用unescape(encodeURIComponent())（旧方法）
            try {
                const base64Method4 = btoa(unescape(encodeURIComponent(csvContent)));
                resultDiv.innerHTML += `<h4>方法4 (unescape(encodeURIComponent)):</h4>`;
                resultDiv.innerHTML += `<p>${base64Method4}</p>`;
            } catch (e) {
                resultDiv.innerHTML += `<h4>方法4失败: ${e.message}</h4>`;
            }
        }
    </script>
</body>
</html>
